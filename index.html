<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halloween Portal</title>
  <link rel="preload" as="image" href="assets/poster.2b4d37f84e742c99.jpg" fetchpriority="high">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { display: grid; place-items: center; }
    video { display: block; width: min(100vw, 177.777777778vh); height: auto; aspect-ratio: 16 / 9; object-fit: contain; background: transparent; pointer-events: none; }
  </style>
</head>
<body>
  <video autoplay muted playsinline loop preload="auto" disablepictureinpicture disableremoteplayback poster="assets/poster.2b4d37f84e742c99.jpg" src="assets/transition.b75f145c63fe992c.mp4"></video>
  <script>
    (() => {
      const video = document.querySelector('video');
      video.autoplay = true;
      video.loop = true;
      video.muted = true;
      video.defaultMuted = true;
      video.volume = 0;
      video.controls = false;
      video.playsInline = true;
      function play() {
        if (document.hidden || !video.paused) return;
        try {
          const attempt = video.play();
          if (attempt) attempt.catch(() => {});
        } catch (_) { /* Keep the native poster visible if autoplay is denied. */ }
      }
      video.addEventListener('loadeddata', play);
      video.addEventListener('canplay', play);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) play(); });
      window.addEventListener('pageshow', play);
      play();
    })();
  </script>
</body>
</html>
